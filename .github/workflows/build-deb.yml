name: Build and Publish Debian Package

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  APP_NAME: proxmox-logger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Set version from tag or commit hash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
            CURRENT_DATE=$(date +'%Y%m%d')
            echo "VERSION=0.0.0-${CURRENT_DATE}-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-make devscripts lintian

      - name: Install Go dependencies
        run: go mod tidy

      - name: Build Go binary
        run: GOOS=linux GOARCH=amd64 go build -o ${{ env.APP_NAME }} main.go

      - name: Prepare package directory
        run: |
          # Create package directory structure
          rm -rf ${{ env.APP_NAME }}-deb
          mkdir -p ${{ env.APP_NAME }}-deb/DEBIAN
          mkdir -p ${{ env.APP_NAME }}-deb/usr/local/bin
          mkdir -p ${{ env.APP_NAME }}-deb/etc/systemd/system
          mkdir -p ${{ env.APP_NAME }}-deb/etc/proxmox-logger
          mkdir -p ${{ env.APP_NAME }}-deb/etc/default
          mkdir -p ${{ env.APP_NAME }}-deb/var/log
          
          # Copy binary and service file
          cp ${{ env.APP_NAME }} ${{ env.APP_NAME }}-deb/usr/local/bin/
          cp proxmox-logger.service ${{ env.APP_NAME }}-deb/etc/systemd/system/
          
          # Configuration file
          cat > ${{ env.APP_NAME }}-deb/etc/proxmox-logger/config.yml << EOF
          # Proxmox Logger Configuration

          # RabbitMQ Connection Settings
          rabbitmq:
            uri: "amqp://guest:guest@localhost:5672/"
            queue_name: "proxmox_logs"
            exchange_name: "proxmox_exchange"  # Optional, leave empty to publish directly to queue
            routing_key: "proxmox.logs"  # Used with exchange if specified

          # Rsyslog Listener Settings
          rsyslog:
            protocol: "tcp"
            port: "18006"

          # Logging Settings
          logging:
            log_file: "/var/log/proxmox-logger.log"
            log_level: "info"
          EOF
          
          # Environment defaults file
          cat > ${{ env.APP_NAME }}-deb/etc/default/proxmox-logger << EOF
          # Proxmox Logger Environment Variables
          # This file is sourced by systemd service

          # RabbitMQ Settings
          # PROXMOX_LOGGER_RABBITMQ_URI="amqp://guest:guest@localhost:5672/"
          # PROXMOX_LOGGER_QUEUE_NAME="proxmox_logs"
          # PROXMOX_LOGGER_EXCHANGE=""
          # PROXMOX_LOGGER_ROUTING_KEY=""

          # Rsyslog Settings
          # PROXMOX_LOGGER_PROTOCOL="tcp"
          # PROXMOX_LOGGER_PORT="18006"

          # Logging Settings
          # PROXMOX_LOGGER_LOG_FILE="/var/log/proxmox-logger.log"

          # Configuration file location (default is /etc/proxmox-logger/config.yml)
          # PROXMOX_LOGGER_CONFIG="/etc/proxmox-logger/config.yml"
          EOF
          
          # Create empty log file
          touch ${{ env.APP_NAME }}-deb/var/log/proxmox-logger.log
          chmod 644 ${{ env.APP_NAME }}-deb/var/log/proxmox-logger.log
          
          # Create control file with dynamic version
          cat > ${{ env.APP_NAME }}-deb/DEBIAN/control << EOF
          Package: ${{ env.APP_NAME }}
          Version: ${{ env.VERSION }}
          Architecture: amd64
          Maintainer: Evrim Uysal <evrim.uysal@yahoo.com>
          Description: Proxmox Logger Service
           A lightweight Go application that captures Proxmox pvedaemon logs
           and forwards them to RabbitMQ.
          Section: utils
          Priority: optional
          Homepage: https://github.com/evrimuysal/Proxmox-Logger
          EOF

      - name: Create postinst script
        run: |
          cat > ${{ env.APP_NAME }}-deb/DEBIAN/postinst << EOF
          #!/bin/bash
          set -e
          
          echo "[postinst] Reloading systemd and enabling service"
          systemctl daemon-reload
          systemctl enable proxmox-logger
          systemctl restart proxmox-logger
          
          exit 0
          EOF
          chmod 755 ${{ env.APP_NAME }}-deb/DEBIAN/postinst

      - name: Create prerm script
        run: |
          cat > ${{ env.APP_NAME }}-deb/DEBIAN/prerm << EOF
          #!/bin/bash
          set -e
          
          echo "[prerm] Stopping and disabling service before removal"
          systemctl stop proxmox-logger
          systemctl disable proxmox-logger
          
          exit 0
          EOF
          chmod 755 ${{ env.APP_NAME }}-deb/DEBIAN/prerm

      - name: Create postrm script
        run: |
          cat > ${{ env.APP_NAME }}-deb/DEBIAN/postrm << EOF
          #!/bin/bash
          set -e
          
          echo "[postrm] Cleaning up service files"
          systemctl daemon-reload
          
          exit 0
          EOF
          chmod 755 ${{ env.APP_NAME }}-deb/DEBIAN/postrm

      - name: Build Debian package
        run: |
          # Make binary executable
          chmod +x ${{ env.APP_NAME }}-deb/usr/local/bin/${{ env.APP_NAME }}
          
          # Build the package
          dpkg-deb --build ${{ env.APP_NAME }}-deb
          mv ${{ env.APP_NAME }}-deb.deb ${{ env.APP_NAME }}_${{ env.VERSION }}_amd64.deb
          ls -la ${{ env.APP_NAME }}_${{ env.VERSION }}_amd64.deb

      - name: Upload Debian package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-deb
          path: ${{ env.APP_NAME }}_${{ env.VERSION }}_amd64.deb

  publish-to-apt-repo:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      pages: write
    env:
      APP_NAME: proxmox-logger
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          persist-credentials: true

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-deb
          path: ./download

      - name: Setup APT Repository structure
        run: |
          # Create proper Debian repository structure
          mkdir -p deb/pool/main/p/${{ env.APP_NAME }}
          mkdir -p deb/dists/stable/main/binary-amd64
          
          # Copy the deb package to the pool
          cp ./download/${{ env.APP_NAME }}_*.deb deb/pool/main/p/${{ env.APP_NAME }}/

      - name: Install required tools
        run: sudo apt-get install -y dpkg-dev apt-utils

      - name: Generate Packages file
        run: |
          # Generate Packages file
          cd deb
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      
      - name: Verify GPG key
        run: gpg --list-secret-keys

      - name: Generate Release files
        run: |
          cd deb/dists/stable
          
          # Create Release file
          cat > Release << EOF
          Origin: Proxmox Logger Repository
          Label: Proxmox Logger
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Description: Debian packages for Proxmox Logger
          Date: $(date -u +"%a, %d %b %Y %H:%M:%S UTC")
          EOF
          
          # Add checksums to Release file
          apt-ftparchive release . >> Release
          
          # Sign Release file
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --default-key ${{ secrets.GPG_KEY_ID }} -abs -o Release.gpg Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --default-key ${{ secrets.GPG_KEY_ID }} --clearsign -o InRelease Release

      - name: Export public key
        run: |
          gpg --armor --export ${{ secrets.GPG_KEY_ID }} > gpg-key.asc

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Commit changes to gh-pages
        run: |
          git add deb/ gpg-key.asc
          git commit -m "Update APT repository with ${{ env.APP_NAME }} version ${{ env.VERSION }}" || echo "No changes to commit"
          git push

  attach-to-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_NAME: proxmox-logger
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-deb
          path: ./download

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ./download/${{ env.APP_NAME }}_*_amd64.deb
          generate_release_notes: true
          draft: false 