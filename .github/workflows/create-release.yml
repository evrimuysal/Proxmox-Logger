name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (without v prefix, e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      release_title:
        description: 'Release title'
        required: true
        default: 'Initial Release'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'This is an automated release of Proxmox Logger'
      is_prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Release and Tag
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.release_title }}
          body: ${{ github.event.inputs.release_notes }}
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease }}
          generate_release_notes: true

      - name: Output Release URL
        run: echo "Release created at ${{ steps.create_release.outputs.url }}" 