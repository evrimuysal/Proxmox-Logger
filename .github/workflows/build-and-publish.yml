name: Build, Package and Publish APT Repo

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      APP_NAME: proxmox-logger
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout main branch for building
        uses: actions/checkout@v3
        with:
          ref: master # Ana kodun bulunduğu branch
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Go dependencies
        run: |
          go mod tidy
          
      - name: Build binary
        run: |
          mkdir -p build
          GOOS=linux GOARCH=amd64 go build -o build/${APP_NAME} main.go

      - name: Create DEB package structure with systemd
        run: |
          mkdir -p pkg/DEBIAN
          mkdir -p pkg/usr/local/bin
          mkdir -p pkg/etc/systemd/system
          mkdir -p pkg/etc/proxmox-logger
          mkdir -p pkg/etc/default
          mkdir -p pkg/var/log

          # Binary
          cp build/${APP_NAME} pkg/usr/local/bin/${APP_NAME}
          chmod +x pkg/usr/local/bin/${APP_NAME}

          # Configuration file
          cat <<EOF > pkg/etc/proxmox-logger/config.yml
          # Proxmox Logger Configuration

          # RabbitMQ Connection Settings
          rabbitmq:
            uri: "amqp://guest:guest@localhost:5672/"
            queue_name: "proxmox_logs"
            exchange_name: "proxmox_exchange"  # Optional, leave empty to publish directly to queue
            routing_key: "proxmox.logs"  # Used with exchange if specified

          # Rsyslog Listener Settings
          rsyslog:
            protocol: "tcp"
            port: "18006"

          # Logging Settings
          logging:
            log_file: "/var/log/proxmox-logger.log"
            log_level: "info"
          EOF

          # Environment defaults file
          cat <<EOF > pkg/etc/default/proxmox-logger
          # Proxmox Logger Environment Variables
          # This file is sourced by systemd service

          # RabbitMQ Settings
          # PROXMOX_LOGGER_RABBITMQ_URI="amqp://guest:guest@localhost:5672/"
          # PROXMOX_LOGGER_QUEUE_NAME="proxmox_logs"
          # PROXMOX_LOGGER_EXCHANGE=""
          # PROXMOX_LOGGER_ROUTING_KEY=""

          # Rsyslog Settings
          # PROXMOX_LOGGER_PROTOCOL="tcp"
          # PROXMOX_LOGGER_PORT="18006"

          # Logging Settings
          # PROXMOX_LOGGER_LOG_FILE="/var/log/proxmox-logger.log"

          # Configuration file location (default is /etc/proxmox-logger/config.yml)
          # PROXMOX_LOGGER_CONFIG="/etc/proxmox-logger/config.yml"
          EOF

          # Create empty log file
          touch pkg/var/log/proxmox-logger.log
          chmod 644 pkg/var/log/proxmox-logger.log

          # Control file
          cat <<EOF > pkg/DEBIAN/control
          Package: ${APP_NAME}
          Version: ${VERSION#v}
          Section: base
          Priority: optional
          Architecture: amd64
          Maintainer: Evrim Uysal <evrim.uysal@yahoo.com>
          Description: Logger for Proxmox, sends events to RabbitMQ.
          EOF

          # postinst
          cat <<EOF > pkg/DEBIAN/postinst
          #!/bin/bash
          set -e

          systemctl daemon-reload

          # Eğer servis varsa enable etmeye ve başlatmaya çalış
          if systemctl list-unit-files | grep -q 'proxmox-logger.service'; then
            systemctl enable proxmox-logger || true
            systemctl restart proxmox-logger || true
          fi

          exit 0
          EOF
          chmod +x pkg/DEBIAN/postinst

          # prerm
          cat <<EOF > pkg/DEBIAN/prerm
          #!/bin/bash
          set -e
          systemctl stop ${APP_NAME}
          systemctl disable ${APP_NAME}
          EOF
          chmod +x pkg/DEBIAN/prerm

          # postrm
          cat <<EOF > pkg/DEBIAN/postrm
          #!/bin/bash
          set -e
          systemctl daemon-reload
          EOF
          chmod +x pkg/DEBIAN/postrm

          # systemd service
          cat <<EOF > pkg/etc/systemd/system/${APP_NAME}.service
          [Unit]
          Description=Proxmox Logger Service
          After=network.target
          Requires=rsyslog.service

          [Service]
          ExecStart=/usr/local/bin/${APP_NAME}
          EnvironmentFile=-/etc/default/proxmox-logger
          ExecStartPost=/bin/systemctl restart rsyslog.service
          ExecStopPost=/bin/systemctl restart rsyslog.service
          Restart=on-failure
          User=root
          Group=root
          ExecReload=/bin/kill -HUP \$MAINPID
          ExecStop=/bin/kill -TERM \$MAINPID

          [Install]
          WantedBy=multi-user.target
          EOF

          # Helper script for handling rsyslog restart
          cat <<EOF > pkg/usr/local/bin/restart-proxmox-logger
          #!/bin/bash
          systemctl restart proxmox-logger.service
          systemctl restart rsyslog.service
          EOF
          chmod +x pkg/usr/local/bin/restart-proxmox-logger

          # Build .deb
          dpkg-deb --build pkg
          mv pkg.deb ${APP_NAME}_${VERSION#v}_amd64.deb
          
      - name: Install apt tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev

      # Buradan sonra gh-pages branch'e geçiş yapıyoruz
      - name: Checkout gh-pages branch for publishing
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          fetch-depth: 0
          clean: false
          
      - name: Prepare APT repo structure
        run: |
          # .deb dosyasını geçici olarak koruyalım
          mkdir -p /tmp/artifacts
          cp ${APP_NAME}_${VERSION#v}_amd64.deb /tmp/artifacts/
          
          # Clear any existing deb directory to avoid conflicts
          rm -rf deb
          
          # Create proper Debian repository structure
          mkdir -p deb/pool/main
          mkdir -p deb/dists/stable/main/binary-amd64
          
          # Copy the DEB package to the pool
          cp /tmp/artifacts/${APP_NAME}_${VERSION#v}_amd64.deb deb/pool/main/
          
          # Generate Packages files
          cd deb
          
          # Create uncompressed Packages file
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          
          # Create compressed Packages files
          gzip -k -9 dists/stable/main/binary-amd64/Packages
          bzip2 -k -9 dists/stable/main/binary-amd64/Packages
          
          # Create Release file for the component
          cd dists/stable
          
          # Generate Release file
          cat > Release << EOF
          Origin: EvrimUysal
          Label: Proxmox Logger
          Suite: stable
          Codename: stable
          Date: $(date -R)
          Architectures: amd64
          Components: main
          Description: APT repository for Proxmox Logger
          EOF
          
          # Add hashes to the Release file
          apt-ftparchive release . >> Release
          
          # Debug output for verification
          echo "Contents of Packages file:"
          cat main/binary-amd64/Packages
          
          echo "Contents of Release file:"
          cat Release

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      
      - name: Verify GPG key
        run: gpg --list-secret-keys
        
      - name: Sign Release file
        run: |
          cd deb/dists/stable
          
          # Sign Release file
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --default-key ${{ secrets.GPG_KEY_ID }} -abs -o Release.gpg Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --default-key ${{ secrets.GPG_KEY_ID }} --clearsign -o InRelease Release
          
          # Verify signatures were created
          ls -la Release.gpg InRelease
          
      - name: Export public key
        run: |
          gpg --armor --export ${{ secrets.GPG_KEY_ID }} > gpg-key.asc
          cp gpg-key.asc deb/

      - name: Commit and publish to gh-pages branch
        run: |
          # Configure Git for gh-pages branch
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Force add the deb directory to ensure it overwrites any existing content
          git add -f deb/
          git add -f gpg-key.asc
          git commit -m "Publish APT repo for ${VERSION}"
          
          # Push to gh-pages branch
          git push -f origin gh-pages 