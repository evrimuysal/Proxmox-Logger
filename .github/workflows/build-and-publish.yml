name: Build, Package and Publish APT Repo

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      APP_NAME: proxmox-logger
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binary
        run: |
          mkdir -p build
          GOOS=linux GOARCH=amd64 go build -o build/${APP_NAME} main.go

      - name: Create DEB structure
        run: |
          mkdir -p ${APP_NAME}-deb/DEBIAN
          mkdir -p ${APP_NAME}-deb/opt/${APP_NAME}
          mkdir -p ${APP_NAME}-deb/etc/systemd/system
          
          # Copy binary to correct location
          cp build/${APP_NAME} ${APP_NAME}-deb/opt/${APP_NAME}/
          
          # Copy service file
          cp proxmox-logger.service ${APP_NAME}-deb/etc/systemd/system/

          cat <<EOF > ${APP_NAME}-deb/DEBIAN/control
          Package: ${APP_NAME}
          Version: ${VERSION#v}
          Section: base
          Priority: optional
          Architecture: amd64
          Maintainer: Evrim Uysal <evrimuysal@gmail.com>
          Description: Logger for Proxmox events, sends data to RabbitMQ
           APT üzerinden kurulum için yapılandırılmıştır.
          EOF
          
      - name: Create postinst script
        run: |
          cat > ${APP_NAME}-deb/DEBIAN/postinst << EOF
          #!/bin/sh
          set -e
          
          # Make binary executable
          chmod +x /opt/${APP_NAME}/${APP_NAME}
          
          # Enable and start service
          systemctl daemon-reload
          systemctl enable proxmox-logger.service
          systemctl start proxmox-logger.service || echo "Service could not be started, please check logs"
          
          exit 0
          EOF
          chmod 755 ${APP_NAME}-deb/DEBIAN/postinst

      - name: Build .deb package
        run: |
          dpkg-deb --build ${APP_NAME}-deb
          mv ${APP_NAME}-deb.deb ${APP_NAME}_${VERSION#v}_amd64.deb

      - name: Prepare APT repo structure
        run: |
          mkdir -p deb/pool/main
          mkdir -p deb/dists/stable/main/binary-amd64
          mv ${APP_NAME}_${VERSION#v}_amd64.deb deb/pool/main/

          dpkg-scanpackages deb/pool /dev/null | gzip -9c > deb/dists/stable/main/binary-amd64/Packages.gz

          cat <<EOF > deb/dists/stable/Release
          Origin: EvrimUysal
          Label: Proxmox Logger
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Description: APT repo for Proxmox Logger
          EOF

      - name: Commit and push to main branch (for GitHub Pages)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Fetch all branches first
          git fetch --all
          
          # Try to checkout main branch
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git checkout -b gh-pages-temp
            git reset --hard origin/main
          else
            git checkout -b gh-pages-temp
            git commit --allow-empty -m "Initial empty commit for gh-pages"
          fi
          
          # Copy repo structure and add
          cp -r deb ./
          git add deb/
          
          # Commit and push with force if needed
          git commit -m "Publish APT repo for ${VERSION}" || echo "No changes to commit"
          git push --force origin gh-pages-temp:main 