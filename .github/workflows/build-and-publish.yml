name: Build, Package and Publish APT Repo

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      APP_NAME: proxmox-logger
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binary
        run: |
          mkdir -p build
          GOOS=linux GOARCH=amd64 go build -o build/${APP_NAME} main.go

      - name: Create DEB package structure with systemd
        run: |
          mkdir -p pkg/DEBIAN
          mkdir -p pkg/usr/local/bin
          mkdir -p pkg/etc/systemd/system

          # Binary
          cp build/${APP_NAME} pkg/usr/local/bin/${APP_NAME}
          chmod +x pkg/usr/local/bin/${APP_NAME}

          # Control file
          cat <<EOF > pkg/DEBIAN/control
          Package: ${APP_NAME}
          Version: ${VERSION#v}
          Section: base
          Priority: optional
          Architecture: amd64
          Maintainer: Evrim Uysal <evrim.uysal@yahoo.com>
          Description: Logger for Proxmox, sends events to RabbitMQ.
          EOF

          # postinst
          cat <<EOF > pkg/DEBIAN/postinst
          #!/bin/bash
          set -e
          systemctl daemon-reload
          systemctl enable ${APP_NAME}
          systemctl restart ${APP_NAME}
          EOF
          chmod +x pkg/DEBIAN/postinst

          # prerm
          cat <<EOF > pkg/DEBIAN/prerm
          #!/bin/bash
          set -e
          systemctl stop ${APP_NAME}
          systemctl disable ${APP_NAME}
          EOF
          chmod +x pkg/DEBIAN/prerm

          # postrm
          cat <<EOF > pkg/DEBIAN/postrm
          #!/bin/bash
          set -e
          systemctl daemon-reload
          EOF
          chmod +x pkg/DEBIAN/postrm

          # systemd service
          cat <<EOF > pkg/etc/systemd/system/${APP_NAME}.service
          [Unit]
          Description=Proxmox Logger Service
          After=network.target

          [Service]
          ExecStart=/usr/local/bin/${APP_NAME}
          Restart=on-failure
          User=root
          Group=root
          ExecReload=/bin/kill -HUP \$MAINPID
          ExecStop=/bin/kill -TERM \$MAINPID

          [Install]
          WantedBy=multi-user.target
          EOF

          # Build .deb
          dpkg-deb --build pkg
          mv pkg.deb ${APP_NAME}_${VERSION#v}_amd64.deb

      - name: Prepare APT repo structure
        run: |
          mkdir -p deb/pool/main
          mkdir -p deb/dists/stable/main/binary-amd64
          mv ${APP_NAME}_${VERSION#v}_amd64.deb deb/pool/main/

          dpkg-scanpackages deb/pool /dev/null | gzip -9c > deb/dists/stable/main/binary-amd64/Packages.gz

          cat <<EOF > deb/dists/stable/Release
          Origin: EvrimUysal
          Label: Proxmox Logger
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Description: APT repo for Proxmox Logger
          EOF

      - name: Commit and publish to main branch (GitHub Pages)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull origin main
          cp -r deb ./  # Overwrite local deb dir
          git add deb/
          git commit -m "Publish APT repo for ${VERSION}"
          git push origin HEAD:main 