name: Auto Tag on Push

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "deb/**"
      - "README.md"

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed for creating tags and releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Generate new version number
        id: version
        run: |
          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Extract version components
          if [[ $LATEST_TAG =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            
            # Increment patch version
            PATCH=$((PATCH + 1))
          else
            # If no valid tag found, start with v0.1.0
            MAJOR=0
            MINOR=1
            PATCH=0
          fi
          
          # Set new version
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Get current date in YYYYMMDD format
          DATE=$(date +'%Y%m%d')
          echo "date=$DATE" >> $GITHUB_OUTPUT
          
          # Get short commit hash
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          echo "commit=$COMMIT_SHORT" >> $GITHUB_OUTPUT
      
      - name: Create annotated tag
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DATE=${{ steps.version.outputs.date }}
          COMMIT=${{ steps.version.outputs.commit }}
          
          # Configure Git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Check if tag already exists
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping tag creation"
            exit 0
          fi
          
          # Create tag with annotation
          git tag -a $VERSION -m "Auto-tag version $VERSION created on $DATE from commit $COMMIT"
          
          # Push tag
          git push origin $VERSION
          
          echo "Created and pushed tag: $VERSION"
          
      - name: Wait for build-deb workflow to complete
        run: |
          echo "Waiting for build-deb workflow to complete..."
          sleep 30  # Give some time for the workflow to start
      
      - name: Create GitHub Release (if build failed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          body: |
            Automated release for version ${{ steps.version.outputs.version }}
            
            Created on ${{ steps.version.outputs.date }} from commit ${{ steps.version.outputs.commit }}
          draft: false
          generate_release_notes: true 